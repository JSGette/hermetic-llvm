name: Verify LLVM prebuilt stage 1

# Checks that the stage-1 toolchain of each FDO-optimized LLVM prebuilt release
# matches the one its release build produced by rerunning the release build
# against the remote cache without executing any action, see check_stage1.sh.
# Releases built after #825 stored their results in a separate BuildBuddy org,
# which the key used here can't read.

on:
  push:
    branches:
      - verify-stage1

permissions:
  contents: read

concurrency:
  group: verify-stage1
  cancel-in-progress: true

jobs:
  check:
    name: Check stage 1 of ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - tag: llvm-22.1.8-1
            sha: e086af4b77f850070d7b5db3523aece3ac6ecf9a
          - tag: llvm-21.1.8-10
            sha: c6e45dfcb71009ac44b66386fe83e0e0b9cdfb2d
          - tag: llvm-23.1.0-rc1-1
            sha: 627850996ab873cdb18d14c288304669ff6d2e12
          - tag: llvm-23.1.0-1
            sha: c872f50d272ae7c0a59f8f49c31fa6e1cad25f6f
          - tag: llvm-22.1.8-2
            sha: e768d7589c1d0a6c6aa7aac61c24bd423a3e9efd
          - tag: llvm-23.1.0-2
            sha: 63757394db1e312b35ed98df4eb64f79fb38f908
          - tag: llvm-23.1.0-3
            sha: ab6bd645c759585112fde74540b7ebeb26ac56a7
          - tag: llvm-23.1.0-4
            sha: a8135d96191c856c45f6a64a1743a17e46a4baca
          - tag: llvm-23.1.2-1
            sha: 90a3a2fc9a296146c9b054faf6a5ca807b0430f7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: verify
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.sha }}
          path: src
          persist-credentials: false
      - name: Check stage 1
        working-directory: src
        env:
          TAG: ${{ matrix.tag }}
          VERIFY_DIR: ${{ github.workspace }}/verify
        run: bash "$VERIFY_DIR/.github/verify-prebuilts/check_stage1.sh" "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage1-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/exec_log.zst
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
